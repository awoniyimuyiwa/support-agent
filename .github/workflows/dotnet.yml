# This workflow automates the continuous integration pipeline for the Support Agent suite.
# It builds the multi-project architecture and runs end-to-end Aspire integration tests.

name: Support Agent CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true # Automatically caches NuGet dependencies to speed up future runs
        # Tells the runner to use Central Package Management properties for caching hashes 
        # instead of searching for a missing packages.lock.json file
        cache-dependency-path: 'Directory.Packages.props'

    # Installs the LLVM compiler toolchain required to native-compile
    # and relink the client-side browser SQLite C-source libraries into WebAssembly format.
    - name: Install WebAssembly Tools Workload
      run: dotnet workload install wasm-tools

    - name: Restore NuGet Dependencies
      run: dotnet restore

    # .NET 10 automatically pulls down the required background testing control plane
    # assets via NuGet package graphs during this execution block
    - name: Build Solution & Execute AppHost Integration Tests
      env: 
        # Force the AppHost out of Dev mode so it drops pgAdmin, RedisInsight, and Volumes
        ASPNETCORE_ENVIRONMENT: Testing
        # Tell the C compiler to skip heavy optimization passes on the SQLite binary
        WasmBuildingForEditor: "true"
      run: |
        dotnet test --configuration Release \
          --timeout 15m